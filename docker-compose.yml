# DocuSense — full stack: API + web UI, Qdrant, and Ollama.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:3b   # one time, ~2GB
#   open http://localhost:8000
#
# Running Qdrant as a server rather than the embedded on-disk mode matters for
# two reasons: the embedded store allows only one process at a time (a second
# worker fails to start), and its payload indexes are ignored, so every
# metadata filter degrades to a full scan.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image has no curl or wget, so probe from Qdrant's own entrypoint.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: prod
      # Required in prod; the app refuses to start without it. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env before starting}

      # Service addresses inside the compose network.
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434

      # Optional: enables LLM query rewriting. Retrieval works without it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # SQLite database and uploaded documents survive a container rebuild.
      - api_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  qdrant_storage:
  ollama_models:
  api_data:

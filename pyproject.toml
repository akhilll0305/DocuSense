[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docusense"
version = "0.1.0"
description = "Research Paper Analysis RAG System with section-aware retrieval and academic citations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Akhil Reddy", email = "r.akhilreddy007@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["docusense*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
# The package is not installed into the environment, so `import docusense`
# resolves only because the repo root is on sys.path. `python -m pytest` puts
# it there; a bare `pytest` does not. CI runs the bare form, so four test
# modules that import at the top level failed to collect while the suite
# passed locally. This makes both invocations behave the same.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests requiring live Qdrant/Ollama services",
]
addopts = "-v --cov=docusense --cov-report=term-missing"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    env:
      # Deterministic config so tests never touch a developer's local services.
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-key-not-used-outside-github-actions
      QDRANT_MODE: memory
      # Integration tests use an in-memory Qdrant and mock the LLM, so no
      # Ollama or Gemini credentials are needed.
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system packages
        # libmagic backs file-type detection; tesseract is the OCR fallback.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 tesseract-ocr

      - name: Install dependencies
        # CPU-only torch: the default wheel pulls ~2GB of unused CUDA libraries.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache sentence-transformers models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-v1

      - name: Lint
        run: ruff check docusense scripts

      - name: Test
        run: pytest --cov=docusense --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        # Build only — running the stack needs Ollama models that are too large
        # to pull on every CI run.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: docusense:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
